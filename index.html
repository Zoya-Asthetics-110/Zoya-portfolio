
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoya | Graphic Designer & Web Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #1C1C1C;
        --panel-bg: rgba(42, 42, 42, 0.4);
        --accent-primary: #6C5B7B;
        --accent-secondary: #355C7D;
        --highlight: #F8B195;
        --text-primary: #EAEAEA;
        --text-secondary: #B0B0B0;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-primary);
        font-family: 'Poppins', sans-serif;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, .font-montserrat {
        font-family: 'Montserrat', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-dark);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--panel-bg);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent-primary);
      }
      .glass {
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .panel {
        background: var(--panel-bg);
        border-radius: 2rem;
        backdrop-filter: blur(10px);
        padding: 2.5rem;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }
      .floating-icon {
        filter: drop-shadow(0 0 10px rgba(248, 177, 149, 0.2));
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      .perspective-container {
        perspective: 1000px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom": "https://esm.sh/react-dom@^19.2.4",
        "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
        "react/jsx-runtime": "https://esm.sh/react@^19.2.4/jsx-runtime",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
        "framer-motion": "https://esm.sh/framer-motion@^11.11.11",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
